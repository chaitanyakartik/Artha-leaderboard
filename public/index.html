<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artha Leaderboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Artha Leaderboard</h1>
    <div class="sub">predictions in &rarr; scored against ground truth &rarr; on the board</div>
  </header>

  <nav id="tabs"></nav>

  <section class="bar">
    <label>Dataset
      <select id="dataset"></select>
    </label>
    <span id="gtStatus" class="gt"></span>
    <div class="spacer"></div>
    <button id="newDataset">+ Dataset</button>
    <button id="uploadGt">Upload GT</button>
    <button id="addRun" class="primary">+ Add run</button>
    <button id="manualRun">Manual entry</button>
  </section>

  <div id="msg"></div>
  <main><table id="board"><thead></thead><tbody></tbody></table></main>

  <input type="file" id="filePicker" accept="application/json" hidden />
  <script src="/app.js"></script>
</body>
</html>
